function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'));}catch(e){return defaultState()}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function computeWeekFromDate(){const start=new Date(state.startDate+'T00:00:00');const diff=Math.floor((new Date().setHours(0,0,0,0)-start)/DAY_MS);return Math.min(12,Math.max(1,Math.floor(diff/7)+1));}
function syncCurrentWeek(save=true){
  if(!state.weekAutoMode)return;
  const w=computeWeekFromDate();
  if(w!==state.currentWeek){
    const followSelection=state.selectedWeek===state.currentWeek;
    state.currentWeek=w;
    if(followSelection)state.selectedWeek=w;
    if(save)saveState();
  }
}
function dateISO(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function weekDate(week,dayOffset){const d=new Date(state.startDate+'T00:00:00');d.setDate(d.getDate()+(week-1)*7+dayOffset);return d;}
function fmtDate(d){return d.toLocaleDateString('hr-HR',{weekday:'short',day:'numeric',month:'short'});}
function phaseForWeek(week){let found=state.phaseHistory[0]?.phase||state.currentPhase;for(const h of [...state.phaseHistory].sort((a,b)=>a.week-b.week)){if(h.week<=week)found=h.phase;}return found;}
function rehabDayForSession(phaseId,sessionIndex){const p=rehabPhases[phaseId];if(!p)return[];if(sessionIndex===3)return[];if(p.dayMode==='same')return p.days[0];const map={0:0,1:1,2:2};return p.days[map[sessionIndex]]||[];}
function sessionDef(index){return [
  {name:'Rehab Day 1 + Upper A',tag:'Ponedjeljak',offset:0,upper:'A'},
  {name:'Rehab Day 2 + Upper B',tag:'Srijeda',offset:2,upper:'B'},
  {name:'Rehab Day 3 + Upper C',tag:'Petak',offset:4,upper:'C'},
  {name:'Upper Body — hipertrofija',tag:'Nedjelja',offset:6,upper:'U'}
][index];}
function sessionKey(week,index){return `w${week}s${index}`}
function completedSession(week,index){return state.logs[sessionKey(week,index)]?.completed===true}
function lastUpperResult(exerciseId,beforeWeek,beforeSession){let best=null;for(let w=1;w<=12;w++){for(let s=0;s<4;s++){if(w>beforeWeek||(w===beforeWeek&&s>=beforeSession))continue;const log=state.logs[sessionKey(w,s)];if(!log?.completed)continue;const ex=log.exercises?.find(x=>x.id===exerciseId&&x.kind==='upper');if(ex)best=ex;}}return best;}
function targetWeight(exercise,beforeWeek,beforeSession){const last=lastUpperResult(exercise.id,beforeWeek,beforeSession);if(!last)return null;const firstEntered=last.sets?.find(x=>String(x.weight??'').trim()!=='')?.weight;const rawBase=last.targetWeight??firstEntered;if(rawBase==null||String(rawBase).trim()==='')return null;const base=Number(rawBase);if(!Number.isFinite(base)||base<=0)return null;const valid=last.sets?.length===exercise.sets&&last.sets.every(x=>Number(x.reps)>=exercise.reps&&Number(x.weight)>=base);return valid?base+exercise.increment:base;}
function targetText(ex,week,session){const w=targetWeight(ex,week,session);return w==null?'početna težina: prazno':`cilj: ${w} kg${ex.perHand?' / bučica':''}`}
function painDataForCurrentPhase(){let anyLogged=false,anyIncrease=false;for(let w=state.phaseStartWeek;w<=state.currentWeek;w++){for(let s=0;s<4;s++){const log=state.logs[sessionKey(w,s)];if(!log?.completed)continue;anyLogged=true;const before=Number(log.painBefore)||0,during=Number(log.painDuring)||0,after=Number(log.painAfter)||0;if(during>before||after>before)anyIncrease=true;}}return{anyLogged,anyIncrease};}
function exerciseTargetMet(check){const requiredWeight=check.weightPct!=null?check.weightPct*(Number(state.bodyweight)||0):null;for(let w=state.phaseStartWeek;w<=state.currentWeek;w++){for(let s=0;s<4;s++){const log=state.logs[sessionKey(w,s)];if(!log?.completed)continue;const ex=(log.exercises||[]).find(x=>x.name===check.exercise);if(!ex)continue;const passingSets=(ex.sets||[]).filter(st=>{const repsOk=Number(st.reps)>=check.value;const weightOk=requiredWeight==null||Number(st.weight)>=requiredWeight;return repsOk&&weightOk;}).length;if(passingSets>=check.sets)return true;}}return false;}
function criterionAutoMet(c,timeOk){if(c.type==='auto')return timeOk;if(c.id.endsWith('_pain')){const p=painDataForCurrentPhase();return p.anyLogged&&!p.anyIncrease;}if(c.check)return exerciseTargetMet(c.check);return false;}
function phaseFullyMet(phase){const weeksIn=state.currentWeek-state.phaseStartWeek+1;const timeOk=weeksIn>=phase.minWeeks;return timeOk&&phase.criteria.every(c=>criterionAutoMet(c,timeOk));}
function checkAutoAdvance(){let advanced=false;for(let i=0;i<5;i++){const phase=rehabPhases[state.currentPhase];if(!phase.next)break;if(!phaseFullyMet(phase))break;advancePhaseAuto(phase);advanced=true;}return advanced;}
function advancePhaseAuto(phase){const fromName=phase.name,toId=phase.next,toName=rehabPhases[toId].name;state.currentPhase=toId;state.phaseStartWeek=Math.min(12,state.currentWeek+1);state.phaseHistory.push({phase:toId,week:state.phaseStartWeek,date:new Date().toISOString(),note:'Automatski napredovanje — svi kriteriji zadovoljeni'});if(toId==='phase4'){state.plyoEnabled=true;state.plyoLevel=Math.min(state.plyoLevel,1);state.plyoSuccessCount=0;}if(toId==='phase5'&&state.plyoLevel<5){state.plyoLevel=5;state.plyoSuccessCount=0;}saveState();showPhaseUpCelebration(fromName,toName);}
function showPhaseUpCelebration(fromName,toName){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card celebrate-card"><div class="celebrate-emoji">🎉🦵🎉</div><h2 style="text-align:center;margin-bottom:4px">Napredovao/la si!</h2><p class="muted" style="text-align:center;margin-top:0">Svi kriteriji su zadovoljeni — koljeno je spremno za sljedeći korak.</p><div class="phase-flow" style="justify-content:center;margin:18px 0"><span class="phase-node">${esc(fromName.replace(' — ',' '))}</span><span class="phase-arrow">→</span><span class="phase-node active">${esc(toName.replace(' — ',' '))}</span></div><div class="modal-actions" style="justify-content:center"><button class="btn primary" onclick="closeModal()">Idemo dalje 💪</button></div></div></div>`}

function render(){syncCurrentWeek();checkAutoAdvance();document.querySelectorAll('main > section').forEach(x=>x.classList.add('hidden'));document.getElementById(currentView+'View').classList.remove('hidden');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  if(currentView==='dashboard')renderDashboard();if(currentView==='workout')renderWorkout();if(currentView==='criteria')renderCriteria();if(currentView==='history')renderHistory();if(currentView==='settings')renderSettings();}

function pageHead(title,sub,actions=''){return `<div class="topbar"><div><div class="eyebrow">${esc(sub)}</div><h1 class="title">${esc(title)}</h1></div><div class="top-actions">${actions}</div></div>`}

function renderDashboard(){
  syncCurrentWeek();checkAutoAdvance();
  const phase=rehabPhases[phaseForWeek(state.selectedWeek)];const done=[0,1,2,3].filter(i=>completedSession(state.selectedWeek,i)).length;const totalDone=Object.values(state.logs).filter(x=>x.completed).length;
  const curPhase=rehabPhases[state.currentPhase];const curWeeksIn=state.currentWeek-state.phaseStartWeek+1;const curTimeOk=curWeeksIn>=curPhase.minWeeks;const perfDone=curPhase.next&&curPhase.criteria.every(c=>c.type==='auto'||criterionAutoMet(c,curTimeOk));const waitingOnTime=curPhase.next&&perfDone&&!curTimeOk;
  document.getElementById('dashboardView').innerHTML=pageHead('Tvoj 12-tjedni plan',`Tjedan ${state.selectedWeek} · ${phase.name}`,`<button class="btn" onclick="goToday()">Današnji trening</button>`)+`
  ${waitingOnTime?`<div class="notice" style="margin-bottom:18px">⏳ Izvedba za prelazak u ${esc(rehabPhases[curPhase.next].name)} je zadovoljena — čeka se da prođe minimalno trajanje faze (tjedan ${curWeeksIn}/${curPhase.minWeeks}).</div>`:''}
  <div class="grid cols-4">
    <div class="card metric"><div class="metric-label">Aktivna faza</div><div class="metric-value">${phase.order}/5</div><div class="metric-note">${esc(phase.name)}</div><div class="progress"><span style="width:${phase.order/5*100}%"></span></div></div>
    <div class="card metric"><div class="metric-label">Ovaj tjedan</div><div class="metric-value">${done}/4</div><div class="metric-note">završena treninga</div><div class="progress"><span style="width:${done/4*100}%"></span></div></div>
    <div class="card metric"><div class="metric-label">Ukupno</div><div class="metric-value">${totalDone}/48</div><div class="metric-note">sesija kroz 12 tjedana</div><div class="progress"><span style="width:${totalDone/48*100}%"></span></div></div>
    <div class="card metric"><div class="metric-label">Pliometrija</div><div class="metric-value">${state.plyoEnabled?'L'+state.plyoLevel:'OFF'}</div><div class="metric-note">${state.plyoEnabled?state.plyoSuccessCount+'/2 uspješna prolaza':'uključi od Mid Stage uz bol <3/10'}</div><div class="progress"><span style="width:${state.plyoEnabled?state.plyoLevel/8*100:0}%"></span></div></div>
  </div>
  <div class="section-head"><div><h2>Tjedni</h2><p>Faza se za buduće treninge mijenja tek nakon prolaska exit criteria.</p></div></div>
  <div class="week-strip">${Array.from({length:12},(_,i)=>{const w=i+1;const wd=[0,1,2,3].every(s=>completedSession(w,s));return `<button class="week-btn ${state.selectedWeek===w?'active':''} ${wd?'done':''}" onclick="selectWeek(${w})">${w}</button>`}).join('')}</div>
  <div class="section-head"><div><h2>Raspored treninga</h2><p>Rehab pon/sri/pet, upper-only nedjeljom. Između rehab dana ostaje barem jedan dan odmora.</p></div><span class="status-pill">${fmtDate(weekDate(state.selectedWeek,0))} — ${fmtDate(weekDate(state.selectedWeek,6))}</span></div>
  <div class="grid cols-4">${[0,1,2,3].map(i=>sessionCard(state.selectedWeek,i)).join('')}</div>
  <div class="section-head"><div><h2>Sigurnosna napomena</h2></div></div><div class="notice">Aplikacija prati plan i progresiju, ali ne procjenjuje medicinsku sigurnost. Kod novog “giving-way” osjećaja, naglog porasta izljeva ili boli koja se ne vraća na početnu razinu, prekini progresiju i provjeri s fizioterapeutom ili ortopedom.</div>`;
}
function sessionCard(week,i){const def=sessionDef(i),phase=phaseForWeek(week),rehab=rehabDayForSession(phase,i),upper=upperTemplates[def.upper],done=completedSession(week,i);const preview=[...rehab.slice(0,2).map(x=>x[0]),...upper.slice(0,2).map(x=>x.name)];return `<div class="card session-card"><div style="display:flex;justify-content:space-between;gap:8px"><div class="session-tag">${def.tag}</div><span class="status-pill ${done?'done':''}">${done?'Završeno':'Planirano'}</span></div><h3>${esc(def.name)}</h3><div class="session-date">${fmtDate(weekDate(week,def.offset))}</div><div class="exercise-preview">${preview.map(x=>`<span>• ${esc(x)}</span>`).join('')}<span>+ još ${Math.max(0,rehab.length+upper.length-preview.length)} vježbi</span></div><button class="btn ${done?'':'primary'}" onclick="openSession(${week},${i})">${done?'Otvori zapis':'Pokreni trening'}</button></div>`}

function openSession(week,index){state.selectedWeek=week;state.selectedSession=index;saveState();currentView='workout';render();}
function selectWeek(w){state.selectedWeek=w;saveState();renderDashboard();}
function goToday(){const w=computeWeekFromDate();const day=((new Date().getDay()+6)%7);const offsets=[0,2,4,6];let idx=offsets.reduce((best,x,i)=>Math.abs(x-day)<Math.abs(offsets[best]-day)?i:best,0);openSession(w,idx);}

function buildExercises(week,index){const def=sessionDef(index),phase=phaseForWeek(week);const rehab=rehabDayForSession(phase,index).map((x,k)=>({id:`${phase}_d${index}_${k}`,name:x[0],prescription:x[1],tracking:x[2],sets:x[3]||1,optional:!!x[4],kind:'rehab'}));
  const plyo=(state.plyoEnabled&&index<2&&((phase==='phase4'&&state.plyoLevel<=4)||(phase==='phase5'&&state.plyoLevel>=5)))?plyoLevels[state.plyoLevel].map((x,k)=>({id:`plyo_${state.plyoLevel}_${k}`,name:x[0],prescription:x[1],tracking:'reps',sets:parseSets(x[1]),kind:'plyo'})):[];
  const upper=upperTemplates[def.upper].map(x=>({...x,kind:'upper',tracking:'reps',prescription:`${x.sets} × ${x.reps}`,targetWeight:targetWeight(x,week,index)}));return [...rehab,...plyo,...upper];}
function parseSets(s){const m=String(s).match(/(\d+)\s*[×x]/);return m?Number(m[1]):1;}
function emptySetRows(ex){return Array.from({length:ex.sets||1},(_,i)=>({set:i+1,reps:'',weight:'',done:false}));}
function renderWorkout(){const week=state.selectedWeek,index=state.selectedSession,def=sessionDef(index),phase=rehabPhases[phaseForWeek(week)],key=sessionKey(week,index);const saved=state.logs[key]||{};const exercises=buildExercises(week,index).map(ex=>{const old=saved.exercises?.find(x=>x.id===ex.id);return {...ex,setsData:old?.sets||emptySetRows(ex)};});
 document.getElementById('workoutView').innerHTML=pageHead(def.name,`Tjedan ${week} · ${fmtDate(weekDate(week,def.offset))}`,`<button class="btn" onclick="currentView='dashboard';render()">← Plan</button>`)+`
 <div class="phase-flow" style="margin-bottom:16px"><span class="phase-node active">${esc(phase.name)}</span>${state.plyoEnabled&&index<2?`<span class="phase-arrow">+</span><span class="phase-node">Plyo L${state.plyoLevel}</span>`:''}<span class="phase-arrow">+</span><span class="phase-node">Upper ${def.upper}</span></div>
 <div class="workout-layout"><div class="grid" id="exerciseList">${exercises.map((ex,i)=>exerciseHTML(ex,i,week,index)).join('')}</div>
 <aside class="card side-panel"><h3 style="margin-top:0">Sažetak treninga</h3>
  <div class="form-group"><label>Bol prije treninga (0–10)</label>${rangeHTML('painBefore',saved.painBefore??0)}</div>
  <div class="form-group"><label>Najviša bol tijekom (0–10)</label>${rangeHTML('painDuring',saved.painDuring??0)}</div>
  <div class="form-group"><label>Bol odmah nakon (0–10)</label>${rangeHTML('painAfter',saved.painAfter??0)}</div>
  <div class="form-group"><label>Izljev / oteklina prije (0–3)</label>${rangeHTML('swellingBefore',saved.swellingBefore??0,3)}</div>
  <div class="form-group"><label>Izljev / oteklina iduće jutro (0–3, opcionalno)</label><input class="field" id="swellingNext" type="number" min="0" max="3" step="1" value="${saved.swellingNext??''}" placeholder="upiši naknadno"></div>
  <div class="form-group"><label>Bilješka</label><textarea class="field" id="workoutNotes" rows="4" placeholder="Kako se koljeno ponašalo?">${esc(saved.notes||'')}</textarea></div>
  <div class="summary-box"><strong>Autoregulacija upper-body vježbi:</strong><br>Sve serije na ciljanim ponavljanjima → sljedeći put +2,5 kg za ruke/izolacije ili +5 kg za teže vježbe. Svaki rezultat ispod cilja → težina ostaje ista.</div>
  <button class="btn primary" style="width:100%" onclick="saveWorkout(true)">Spremi i završi</button><button class="btn" style="width:100%;margin-top:8px" onclick="saveWorkout(false)">Spremi nacrt</button>
 </aside></div>`;
}
function rangeHTML(id,val,max=10){return `<div class="range-line"><input id="${id}" type="range" min="0" max="${max}" step="1" value="${val}" oninput="document.getElementById('${id}Val').textContent=this.value"><div class="range-value" id="${id}Val">${val}</div></div>`}
function exerciseHTML(ex,i,week,index){const upper=ex.kind==='upper';const target=upper?(ex.targetWeight==null?'—':`${ex.targetWeight} kg${ex.perHand?' / kom':''}`):ex.prescription;return `<article class="card exercise-card" data-ex-index="${i}" data-ex-id="${esc(ex.id)}"><div class="exercise-head"><div><div class="exercise-name">${esc(ex.name)}</div><div class="exercise-meta">${ex.kind==='rehab'?'REHAB':ex.kind==='plyo'?'PLIOMETRIJA':esc(ex.group)} · cilj ${esc(ex.prescription)}${ex.optional?' · opcionalno':''}</div></div><div class="target-chip">${esc(target)}</div></div><div class="sets">${ex.setsData.map((set,si)=>`<div class="set-row"><div class="set-label">Set ${si+1}</div><input class="field reps-input" type="number" min="0" step="1" value="${esc(set.reps)}" placeholder="${ex.tracking==='seconds'?'sek':'pon.'}"><input class="field weight-input" type="number" min="0" step="0.5" value="${esc(set.weight)}" placeholder="kg${upper&&ex.perHand?' / kom':''}"><label class="target-chip"><input class="check done-input" type="checkbox" ${set.done?'checked':''}> ✓</label></div>`).join('')}</div></article>`}
function saveWorkout(completed){const week=state.selectedWeek,index=state.selectedSession,key=sessionKey(week,index),exDefs=buildExercises(week,index);const cards=[...document.querySelectorAll('#exerciseList .exercise-card')];const exercises=cards.map((card,i)=>{const ex=exDefs[i];const rows=[...card.querySelectorAll('.set-row')];const sets=rows.map((r,j)=>({set:j+1,reps:r.querySelector('.reps-input').value,weight:r.querySelector('.weight-input').value,done:r.querySelector('.done-input').checked}));return {...ex,sets,targetWeight:ex.targetWeight};});
 const log={week,index,date:dateISO(weekDate(week,sessionDef(index).offset)),completed,completedAt:completed?new Date().toISOString():null,exercises,painBefore:+document.getElementById('painBefore').value,painDuring:+document.getElementById('painDuring').value,painAfter:+document.getElementById('painAfter').value,swellingBefore:+document.getElementById('swellingBefore').value,swellingNext:document.getElementById('swellingNext').value===''?null:+document.getElementById('swellingNext').value,notes:document.getElementById('workoutNotes').value};
 state.logs[key]=log;saveState();if(completed)checkAutoAdvance();showToast(completed?'Trening je spremljen.':'Nacrt je spremljen.');if(completed){currentView='dashboard';setTimeout(render,450);} }

function renderCriteria(){syncCurrentWeek();checkAutoAdvance();const phase=rehabPhases[state.currentPhase];const weeksIn=state.currentWeek-state.phaseStartWeek+1;const timeOk=weeksIn>=phase.minWeeks;document.getElementById('criteriaView').innerHTML=pageHead('Faze i exit criteria',phase.name,`<button class="btn" onclick="openPlyoModal()">Pliometrija</button>`)+`
 <div class="card"><div class="phase-flow">${['phase1','phase2','phase3','phase4','phase5'].map((id,i)=>`${i?'<span class="phase-arrow">→</span>':''}<span class="phase-node ${id===state.currentPhase?'active':''}">${esc(rehabPhases[id].name.replace(' — ',' '))}</span>`).join('')}</div></div>
 <div class="section-head"><div><h2>${phase.next?'Test za sljedeću fazu':'Završna faza'}</h2><p>${phase.next?`Minimalno trajanje: ${phase.minWeeks} tjedan(a). Trenutno: ${weeksIn}.`:'Na dostavljenim slikama nije prikazan završni exit criteria za Late Stage.'}</p></div></div>
 ${phase.next?`<div class="card criteria-card"><h3>${timeOk?'Minimalno trajanje zadovoljeno':'Još nije zadovoljeno minimalno trajanje'}</h3><p>Kriteriji se automatski prate iz zabilježenih treninga. Ovdje ih možeš i ručno potvrditi ako želiš prijeći ranije.</p><div class="criteria-list">${phase.criteria.map(c=>{const isAuto=c.type==='auto';const isPain=c.id.endsWith('_pain');const painInfo=isPain?painDataForCurrentPhase():null;const autoMet=criterionAutoMet(c,timeOk);const disabled=isAuto&&timeOk;let hint;if(isAuto)hint='automatski prema tjednu';else if(isPain)hint=painInfo.anyIncrease?'zabilježen porast boli u ovoj fazi — provjeri prije potvrde':(painInfo.anyLogged?'automatski prema zabilježenim treninzima':'još nema zabilježenih treninga u ovoj fazi');else if(c.check)hint=autoMet?`automatski prema zabilježenim treninzima${c.check.weightPct?' (uklj. opterećenje)':''}`:`još nije postignuto u zabilježenim treninzima${c.check.weightPct?' (provjerava i opterećenje)':''}`;else hint='upiši rezultat ili potvrdi izvedbu';return `<label class="criterion"><input type="checkbox" class="criteria-check" ${autoMet?'checked':''} ${disabled?'disabled':''}><div><div class="criterion-name">${esc(c.label)}</div><small>${esc(hint)}</small></div>${isAuto?`<div class="target-chip">${timeOk?'PROLAZ':'ČEKAJ'}</div>`:`<input class="field criteria-value" placeholder="rezultat">`}</label>`;}).join('')}</div><div class="form-group" style="margin-top:15px"><label>Bilješka uz test</label><textarea class="field" id="criteriaNote" rows="3"></textarea></div><button class="btn primary" onclick="advancePhase()">Potvrdi kriterije i prijeđi dalje ručno</button></div>`:`<div class="notice">Late Stage ostaje aktivna završna faza. U ovoj verziji nema automatskog izlaska iz programa jer je ovo finalna faza s progresijom pliometrije.</div>`}
 <div class="section-head"><div><h2>Pliometrijska progresija</h2><p>2× tjedno; napredovanje nakon dva prolaza bez povećanja boli.</p></div></div>${plyoCard()}`;
}
function advancePhase(){const phase=rehabPhases[state.currentPhase];if(!phase.next)return;const checks=[...document.querySelectorAll('.criteria-check')];if(checks.some(x=>!x.checked)){alert('Označi sve exit kriterije prije prelaska.');return;}const weeksIn=state.currentWeek-state.phaseStartWeek+1;if(weeksIn<phase.minWeeks){alert('Minimalno trajanje faze još nije zadovoljeno.');return;}state.currentPhase=phase.next;state.phaseStartWeek=Math.min(12,state.currentWeek+1);state.phaseHistory.push({phase:phase.next,week:state.phaseStartWeek,date:new Date().toISOString(),note:document.getElementById('criteriaNote')?.value||''});if(phase.next==='phase4'){state.plyoEnabled=true;state.plyoLevel=Math.min(state.plyoLevel,1);state.plyoSuccessCount=0;}if(phase.next==='phase5'&&state.plyoLevel<5){state.plyoLevel=5;state.plyoSuccessCount=0;}saveState();showToast('Nova faza vrijedi od sljedećeg tjedna.');renderCriteria();}
function plyoCard(){const allowed=(state.currentPhase==='phase4'&&state.plyoLevel<=4)||(state.currentPhase==='phase5'&&state.plyoLevel>=5);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><div class="eyebrow">${state.plyoEnabled?'Aktivno':'Isključeno'}</div><h3 style="margin:7px 0">Plyo Level ${state.plyoLevel}</h3><div class="muted" style="font-size:13px">${plyoLevels[state.plyoLevel].map(x=>`${esc(x[0])} — ${esc(x[1])}`).join('<br>')}</div></div><span class="status-pill ${allowed?'done':''}">${allowed?'dopušten u fazi':'nije za ovu fazu'}</span></div><div class="summary-box"><strong>Uvjet:</strong> bol mora biti ispod 3/10 i ostati ispod tijekom i nakon treninga. Trenutni broj uspješnih izvedbi: ${state.plyoSuccessCount}/2.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="togglePlyo()">${state.plyoEnabled?'Isključi':'Uključi'}</button><button class="btn primary" onclick="recordPlyoSuccess()" ${!state.plyoEnabled||!allowed?'disabled':''}>Zabilježi uspješan prolaz</button><button class="btn" onclick="recordPlyoPain()" ${!state.plyoEnabled?'disabled':''}>Povećanje boli — reset</button></div></div>`}
function togglePlyo(){state.plyoEnabled=!state.plyoEnabled;saveState();renderCriteria();}
function recordPlyoSuccess(){state.plyoSuccessCount++;if(state.plyoSuccessCount>=2){const max=state.currentPhase==='phase4'?4:8;if(state.plyoLevel<max){state.plyoLevel++;state.plyoSuccessCount=0;showToast('Pliometrija je prešla na sljedeću razinu.');}else{state.plyoSuccessCount=2;showToast('Najviša razina za ovu fazu je završena.');}}saveState();renderCriteria();}
function recordPlyoPain(){state.plyoSuccessCount=0;saveState();renderCriteria();}
function openPlyoModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><h2>Pliometrijska pravila</h2><p class="muted">Početak tek od Mid Stage, uz bol ispod 3/10 koja ostaje ispod tijekom i nakon vježbanja. Izvodi se 2× tjedno nakon zagrijavanja i knee-prepa, prije strength dijela. Sljedeća razina tek nakon dvije izvedbe bez povećanja boli. Late Stage razine 5–8 počinju tek u Late Stage fazi.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Zatvori</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

function trendSVG(rows,series,maxVal){const w=760,h=180,padL=30,padR=14,padT=10,padB=22,innerW=w-padL-padR,innerH=h-padT-padB,n=rows.length;const x=i=>padL+(n===1?0:i*(innerW/(n-1)));const y=v=>padT+innerH-(Math.max(0,Math.min(maxVal,v))/maxVal)*innerH;const step=maxVal<=3?1:2;const gridVals=[];for(let v=0;v<=maxVal;v+=step)gridVals.push(v);const gridLines=gridVals.map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w-padR}" y2="${y(v).toFixed(1)}" stroke="#20304d" stroke-width="1"></line><text x="${padL-6}" y="${(y(v)+3).toFixed(1)}" fill="#7186a6" font-size="10" text-anchor="end">${v}</text>`).join('');const paths=series.map(s=>{const pts=rows.map((r,i)=>({i,v:r[s.key]})).filter(p=>p.v!=null&&p.v!=='');if(!pts.length)return'';const d=pts.map((p,k)=>`${k===0?'M':'L'} ${x(p.i).toFixed(1)} ${y(Number(p.v)).toFixed(1)}`).join(' ');const dots=pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(Number(p.v)).toFixed(1)}" r="2.6" fill="${s.color}"></circle>`).join('');return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.faint?'opacity="0.55"':''}></path>${dots}`;}).join('');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${gridLines}${paths}</svg>`;}
function trendLegend(series){return `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)">${series.map(s=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color};margin-right:6px"></i>${esc(s.label)}</span>`).join('')}</div>`}
function trendsCard(){const rows=Object.entries(state.logs).filter(([,l])=>l.completed).map(([,l])=>l).sort((a,b)=>(a.week-b.week)||(a.index-b.index));if(rows.length<2)return `<div class="card"><h3 style="margin-top:0">Trend kroz treninge</h3><div class="empty">Potrebno je barem 2 završena treninga za graf trenda.</div></div>`;
  const painSeries=[{key:'painBefore',color:'#38bdf8',label:'Bol prije',faint:true},{key:'painDuring',color:'#fbbf24',label:'Bol tijekom'},{key:'painAfter',color:'#fb7185',label:'Bol nakon'}];
  const swellSeries=[{key:'swellingBefore',color:'#a78bfa',label:'Oteklina prije',faint:true},{key:'swellingNext',color:'#34d399',label:'Oteklina iduće jutro'}];
  return `<div class="card"><h3 style="margin-top:0">Trend boli</h3><div class="muted" style="font-size:12px;margin-bottom:8px">${rows.length} zabilježenih treninga · skala 0–10</div>${trendSVG(rows,painSeries,10)}${trendLegend(painSeries)}</div>
 <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Trend otekline</h3><div class="muted" style="font-size:12px;margin-bottom:8px">skala 0–3</div>${trendSVG(rows,swellSeries,3)}${trendLegend(swellSeries)}</div>`;}

function renderHistory(){const rows=Object.entries(state.logs).filter(([,l])=>l.completed).sort((a,b)=>b[1].completedAt.localeCompare(a[1].completedAt));document.getElementById('historyView').innerHTML=pageHead('Povijest treninga','Spremljene sesije',`<button class="btn" onclick="exportData()">Izvezi JSON</button>`)+trendsCard()+`<div class="card table-wrap" style="margin-top:16px">${rows.length?`<table class="history-table"><thead><tr><th>Datum</th><th>Tjedan</th><th>Trening</th><th>Faza</th><th>Bol prije</th><th>Bol tijekom</th><th>Oteklina</th><th></th></tr></thead><tbody>${rows.map(([k,l])=>`<tr><td>${esc(l.date)}</td><td>${l.week}</td><td>${esc(sessionDef(l.index).name)}</td><td>${esc(rehabPhases[phaseForWeek(l.week)].name)}</td><td>${l.painBefore}</td><td>${l.painDuring}</td><td>${l.swellingBefore}</td><td><button class="btn small" onclick="openSession(${l.week},${l.index})">Otvori</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Još nema završenih treninga.</div>`}</div>`}

function renderSettings(){document.getElementById('settingsView').innerHTML=pageHead('Postavke programa','Lokalni profil',`<button class="btn" onclick="exportData()">Backup</button>`)+`
 <div class="grid cols-2"><div class="card"><h3 style="margin-top:0">Osnovno</h3><div class="form-group"><label>Početak 12-tjednog programa</label><input class="field" id="setStart" type="date" value="${esc(state.startDate)}"></div><div class="form-group"><label class="criterion" style="grid-template-columns:24px 1fr;padding:10px 12px"><input type="checkbox" id="setWeekAuto" ${state.weekAutoMode?'checked':''} onchange="document.getElementById('setWeek').disabled=this.checked"><div><div class="criterion-name" style="font-size:13px">Automatski prati tjedan prema datumu</div><small>Isključi ako želiš ručno postaviti tjedan (npr. pauza zbog bolesti)</small></div></label></div><div class="form-group"><label>Trenutni tjedan</label><input class="field" id="setWeek" type="number" min="1" max="12" value="${state.currentWeek}" ${state.weekAutoMode?'disabled':''}></div><div class="form-group"><label>Tjelesna težina (kg)</label><input class="field" id="setBW" type="number" min="20" max="250" step="0.1" value="${state.bodyweight}"></div><div class="form-group"><label>Aktivna rehab faza</label><select class="field" id="setPhase">${Object.values(rehabPhases).map(p=>`<option value="${p.id}" ${p.id===state.currentPhase?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="saveSettings()">Spremi postavke</button></div>
 <div class="card"><h3 style="margin-top:0">Podaci</h3><p class="muted">Aplikacija nema korisnički račun ni cloud. Sve se sprema u LocalStorage na ovom uređaju.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportData()">Izvezi JSON</button><label class="btn">Uvezi JSON<input type="file" accept="application/json" hidden onchange="importData(event)"></label><button class="btn danger" onclick="resetData()">Obriši sve</button></div><div class="summary-box"><strong>Napomena:</strong><br>Late Stage je završna faza programa — nema formalnog exit testa, samo nastavak s progresijom pliometrije do Level 8.</div></div></div>
 <div class="section-head"><div><h2>Upper-body plan</h2><p>Početne težine su prazne. Prvi uneseni rezultat postaje baza za autoregulaciju.</p></div></div><div class="grid cols-2">${Object.entries(upperTemplates).map(([k,v])=>`<div class="card"><div class="eyebrow">Upper ${k}</div><h3>${k==='U'?'Upper-only dan':'Dodatak rehab treningu'}</h3>${v.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:13px"><strong>${esc(x.name)}</strong><br><span class="muted">${x.sets} × ${x.reps} · +${x.increment} kg kad završiš sve serije</span></div>`).join('')}</div>`).join('')}</div>`}
function saveSettings(){const newPhase=document.getElementById('setPhase').value;state.startDate=document.getElementById('setStart').value;state.weekAutoMode=document.getElementById('setWeekAuto').checked;if(state.weekAutoMode){state.currentWeek=computeWeekFromDate();}else{state.currentWeek=Math.max(1,Math.min(12,+document.getElementById('setWeek').value||1));}state.bodyweight=+document.getElementById('setBW').value||83;if(newPhase!==state.currentPhase){state.currentPhase=newPhase;state.phaseStartWeek=state.currentWeek;state.phaseHistory.push({phase:newPhase,week:state.currentWeek,date:new Date().toISOString(),note:'Ručno promijenjeno u postavkama'});}state.selectedWeek=state.currentWeek;saveState();checkAutoAdvance();showToast('Postavke su spremljene.');renderSettings();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`knee-rehab-backup-${dateISO(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=Object.assign(defaultState(),JSON.parse(r.result));saveState();render();showToast('Backup je uvezen.');}catch(err){alert('JSON datoteka nije valjana.')}};r.readAsText(file)}
function resetData(){if(!confirm('Stvarno obrisati sve treninge i postavke?'))return;state=defaultState();saveState();render();}
function showToast(msg){const root=document.getElementById('modalRoot');root.innerHTML=`<div style="position:fixed;right:18px;bottom:18px;z-index:200;background:#052e25;color:#d1fae5;border:1px solid #047857;padding:12px 16px;border-radius:12px;font-weight:800;box-shadow:var(--shadow)">${esc(msg)}</div>`;setTimeout(()=>{if(root.textContent.includes(msg))root.innerHTML=''},1800)}

document.addEventListener('click',e=>{const b=e.target.closest('.nav-btn');if(b){currentView=b.dataset.view;render();}});
render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
